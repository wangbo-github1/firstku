<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异想天开中高考技巧提分</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    padding: 32px 28px;
    width: 100%;
    max-width: 400px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #333;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-bottom: 24px;
  }
  .form-item { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 6px;
  }
  label .req { color: #e74c3c; margin-left: 2px; }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #dcdfe6;
    border-radius: 8px;
    font-size: 15px;
    color: #333;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  input:focus, select:focus { border-color: #667eea; }
  .score-row { display: flex; gap: 12px; }
  .score-row .form-item { flex: 1; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .2s;
  }
  button:active { opacity: .85; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .score-err { color: #e74c3c; font-size: 12px; text-align: center; margin-top: -6px; margin-bottom: 10px; }
  .input-err { border-color: #e74c3c !important; background: #fff5f5; }
  .tip { text-align: center; font-size: 12px; color: #bbb; margin-top: 12px; }
  /* 分析结果弹窗 */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .result {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    animation: pop .25s ease;
  }
  @keyframes pop {
    from { transform: scale(.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .result h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
  .result p { font-size: 14px; color: #666; margin-bottom: 8px; }
  .low-box {
    background: #fff6f0;
    border: 1px solid #ffcfb3;
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0 4px;
    text-align: left;
  }
  .low-item { font-size: 13px; color: #e67e22; margin-bottom: 4px; font-weight: 600; }
  .low-contact { font-size: 13px; color: #e74c3c; margin-top: 8px; line-height: 1.6; }
  .gap-line { font-size: 14px; color: #444; margin-top: 6px; text-align: left; font-weight: 500; }
  .gap-num { color: #e74c3c; font-weight: 700; font-size: 17px; }
  .ok-line { color: #27ae60; font-weight: 700; }
  .wx-box { margin-top: 14px; text-align: center; }
  .wx-link { display: inline-block; }
  .wx-qr { width: 220px; max-width: 70%; height: auto; display: inline-block; border-radius: 6px; }
  .wx-tip { font-size: 12px; color: #999; margin-top: 6px; line-height: 1.5; }
  .close-btn {
    background: #eee;
    color: #555;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    margin-top: 0;
  }
</style>
</head>
<body>
  <!-- 提前加载二维码，保证弹窗出现时图片已就绪（长按识别不失败） -->
  <img src="wechat-qr.png?v=3" alt="" style="display:none;">
  <div class="card">
    <h1>📊 成绩分析</h1>
    <div class="sub">请填写以下信息后点击"开始分析"</div>

    <div class="form-item">
      <label>姓名<span class="req">*</span></label>
      <input type="text" id="name" placeholder="请输入姓名">
    </div>

    <div class="form-item">
      <label>年级<span class="req">*</span></label>
      <select id="grade" onchange="onGradeChange()">
        <option value="">请选择年级</option>
        <option>初二</option>
        <option>初三</option>
      </select>
    </div>

    <div class="score-row">
      <div class="form-item">
        <label>语文<span class="req">*</span></label>
        <input type="number" id="chinese" class="score-input" min="0" max="120" placeholder="0-120">
      </div>
      <div class="form-item">
        <label>数学<span class="req">*</span></label>
        <input type="number" id="math" class="score-input" min="0" max="120" placeholder="0-120">
      </div>
      <div class="form-item">
        <label>英语<span class="req">*</span></label>
        <input type="number" id="english" class="score-input" min="0" max="120" placeholder="0-120">
      </div>
    </div>

    <div class="score-row">
      <div class="form-item">
        <label>政治<span class="req">*</span></label>
        <input type="number" id="politics" class="score-input minor" min="0" max="60" placeholder="0-60">
      </div>
      <div class="form-item">
        <label>历史<span class="req">*</span></label>
        <input type="number" id="history" class="score-input minor" min="0" max="60" placeholder="0-60">
      </div>
      <div class="form-item">
        <label>物理<span class="req">*</span></label>
        <input type="number" id="physics" class="score-input minor" min="0" max="60" placeholder="0-60">
      </div>
    </div>

    <div class="score-row">
      <div class="form-item">
        <label>化学<span class="req">*</span></label>
        <input type="number" id="chemistry" class="score-input minor" min="0" max="60" placeholder="0-60">
      </div>
      <div class="form-item">
        <label>地理<span class="req">*</span></label>
        <input type="number" id="geography" class="score-input minor" min="0" max="60" placeholder="0-60">
      </div>
      <div class="form-item">
        <label>生物<span class="req">*</span></label>
        <input type="number" id="biology" class="score-input minor" min="0" max="60" placeholder="0-60">
      </div>
    </div>

    <button id="analyzeBtn" onclick="analyze()">开始分析</button>
    <div id="scoreErr" class="score-err" style="display:none;"></div>
  </div>

  <!-- 结果弹窗 -->
  <div class="overlay" id="overlay">
    <div class="result">
      <h2>📈 分析结果</h2>
      <p id="rInfo"></p>
      <p id="rScores"></p>
      <p id="rAvg"></p>
      <div id="lowBox" class="low-box" style="display:none;"></div>
      <button class="close-btn" onclick="closeOverlay()">关闭</button>
    </div>
  </div>

<script>
// 年级配置：初二/初三 语数英满分 120、低分线 110
var GRADE_RULES = {
  '初二': { max: 120, low: 110 },
  '初三': { max: 120, low: 110 }
};

// 科目配置：语数英用年级规则；小科（政史理化地生）满分 60、低分线 50
var SUBJECTS = [
  { id: 'chinese',   name: '语文', minor: false },
  { id: 'math',      name: '数学', minor: false },
  { id: 'english',   name: '英语', minor: false },
  { id: 'politics',  name: '政治', minor: true },
  { id: 'history',   name: '历史', minor: true },
  { id: 'physics',   name: '物理', minor: true },
  { id: 'chemistry', name: '化学', minor: true },
  { id: 'geography', name: '地理', minor: true },
  { id: 'biology',   name: '生物', minor: true }
];
var MINOR_MAX = 60;
var MINOR_LOW = 50;

function onGradeChange() {
  var grade = document.getElementById('grade').value;
  var rule = GRADE_RULES[grade];
  if (!rule) { return; }
  // 只调整语数英（非 minor）的满分提示
  var inputs = document.querySelectorAll('.score-input:not(.minor)');
  inputs.forEach(function (el) {
    el.setAttribute('max', rule.max);
    el.setAttribute('min', 0);
    el.setAttribute('placeholder', '0-' + rule.max);
    if (el.value !== '' && Number(el.value) > rule.max) { el.value = ''; }
  });
  validateAll();
}

// 实时校验：每科不能超出可输入范围
function getMaxOf(el) {
  if (el.classList.contains('minor')) { return MINOR_MAX; }
  var grade = document.getElementById('grade').value;
  var rule = GRADE_RULES[grade];
  return rule ? rule.max : 120;
}

function getNameOf(el) {
  for (var i = 0; i < SUBJECTS.length; i++) {
    if (SUBJECTS[i].id === el.id) { return SUBJECTS[i].name; }
  }
  return '';
}

function validateInput(el) {
  var v = el.value;
  var max = getMaxOf(el);
  var errBox = document.getElementById('scoreErr');
  if (v !== '' && (Number(v) > max || Number(v) < 0)) {
    el.classList.add('input-err');
    errBox.textContent = getNameOf(el) + '分数范围为 0 - ' + max + '，超出范围请重新填写';
    errBox.style.display = 'block';
    return false;
  }
  el.classList.remove('input-err');
  // 全部合法后隐藏错误提示
  var anyErr = document.querySelectorAll('.score-input.input-err').length > 0;
  if (!anyErr) { errBox.style.display = 'none'; }
  return true;
}

function validateAll() {
  document.querySelectorAll('.score-input').forEach(function (el) {
    if (el.value !== '') { validateInput(el); }
  });
}

// 输入时即时校验
document.querySelectorAll('.score-input').forEach(function (el) {
  el.addEventListener('input', function () { validateInput(el); });
  el.addEventListener('blur', function () { validateInput(el); });
});

function analyze() {
  var name = document.getElementById('name').value.trim();
  var grade = document.getElementById('grade').value;

  if (!name) { alert('请先输入姓名'); return; }
  if (!grade) { alert('请选择年级'); return; }

  var rule = GRADE_RULES[grade];
  var values = {};   // 各科分数
  var lowSubjects = [];
  var scoreTexts = [];
  var total = 0;

  for (var i = 0; i < SUBJECTS.length; i++) {
    var s = SUBJECTS[i];
    var raw = document.getElementById(s.id).value;
    if (raw === '') { alert('请填写完整的各科分数（' + s.name + '未填写）'); return; }
    var v = Number(raw);
    var max = s.minor ? MINOR_MAX : rule.max;
    var low = s.minor ? MINOR_LOW : rule.low;
    if (v < 0 || v > max) {
      alert(s.name + '分数范围为 0 - ' + max + '，请检查填写内容'); return;
    }
    values[s.name] = v;
    total += v;
    scoreTexts.push(s.name + ' ' + v + ' 分');
    if (v < low) { lowSubjects.push(s.name); }
  }

  var avg = (total / SUBJECTS.length).toFixed(1);
  document.getElementById('rInfo').textContent = name + ' · ' + grade;
  document.getElementById('rScores').textContent = scoreTexts.join('，') + '（总分 ' + total + '）';
  document.getElementById('rAvg').textContent = '九科平均分：' + avg + ' 分';

  var lowBox = document.getElementById('lowBox');
  var html = '';

  // 低分科目：同一行显示
  if (lowSubjects.length > 0) {
    html += '<div class="low-item">' + lowSubjects.join(' ') + '分数较低</div>';
  }

  // 初中：一中 600 线、三中 550 线；达标后显示"已满足"
  if (total >= 600) {
    html += '<div class="gap-line ok-line">✅ 已满足一中的上线标准</div>';
  } else {
    html += '<div class="gap-line">距离一中上线还需要 <span class="gap-num">' + (600 - total) + '</span> 分</div>';
  }
  if (total >= 550) {
    html += '<div class="gap-line ok-line">✅ 已满足三中上线标准</div>';
  } else {
    html += '<div class="gap-line">距离三中上线还需要 <span class="gap-num">' + (550 - total) + '</span> 分</div>';
  }

  // 提分值：总分达到一中线(600)后按 20~50 随机；未达到按 600-总分+随机26~56
  var tifen;
  if (total >= 600) {
    tifen = Math.floor(Math.random() * 31) + 20;
  } else {
    tifen = 600 - total + (Math.floor(Math.random() * 31) + 26);
  }

  // 有低分科目、或总分达到一中上线时，显示提分联系方式和微信二维码
  if (lowSubjects.length > 0 || total >= 600) {
    html += '<div class="low-contact">不补课技巧快速提分至少<span class="gap-num">' + tifen + '</span>分<br>添加微信或者电话联系12345678910</div>';
    html += '<div class="wx-box"><a class="wx-link" href="wechat-qr.png?v=3" target="_blank"><img class="wx-qr" src="wechat-qr.png?v=3" alt="微信二维码"></a><div class="wx-tip">长按识别二维码 添加微信<br>若无法识别，点击二维码放大后再长按</div></div>';
  }

  lowBox.innerHTML = html;
  lowBox.style.display = 'block';

  document.getElementById('overlay').classList.add('show');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}
</script>
</body>
</html>
